{% extends 'base.html' %}
{% block title %}Iniciar sesión - SIGMA-IOT{% endblock %}
{% block content %}
<div class="container">
    <div class="row justify-content-center">
        <div class="col-12 col-sm-8 col-md-6 col-lg-4">
            <div class="card auth-card shadow-sm mt-5">
                <div class="card-body p-4">
                    <div class="text-center mb-4">
                        <i class="bi bi-shield-lock fs-1 text-primary"></i>
                        <h4 class="mt-2 mb-0">SIGMA-IOT</h4>
                        <small class="text-muted">Acceso al panel de control</small>
                    </div>

                    <div id="alertMsg"></div>

                    <form id="loginForm" autocomplete="off">
                        <div class="mb-3">
                            <label class="form-label" for="identificador">Correo o nombre de usuario</label>
                            <input type="text" class="form-control" id="identificador" required
                                   autocomplete="username" placeholder="usuario@correo.com">
                        </div>
                        <div class="mb-3">
                            <label class="form-label" for="password">Contraseña</label>
                            <input type="password" class="form-control" id="password" required
                                   autocomplete="current-password" placeholder="••••••••">
                        </div>
                        <button type="submit" class="btn btn-primary w-100" id="btnLogin">
                            <i class="bi bi-box-arrow-in-right me-1"></i>Iniciar sesión
                        </button>
                    </form>

                    <div class="text-center mt-3">
                        <a href="{{ url_for('auth_forgot_page') }}" class="small">¿Olvidaste tu contraseña?</a>
                    </div>
                    <hr>
                    <div class="text-center">
                        <span class="small text-muted">¿No tienes cuenta?</span>
                        <a href="{{ url_for('auth_register_page') }}" class="small"> Regístrate</a>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}

{% block scripts %}
<script>
    SIGMA.alreadyLoggedRedirect();
    document.getElementById('loginForm').addEventListener('submit', async function (e) {
        e.preventDefault();
        const btn = document.getElementById('btnLogin');
        btn.disabled = true;
        const data = await SIGMA.api('/api/auth/login', {
            method: 'POST',
            body: JSON.stringify({
                identificador: document.getElementById('identificador').value.trim(),
                password: document.getElementById('password').value
            })
        });
        btn.disabled = false;
        if (data && data.success && data.token) {
            SIGMA.guardarSesion(data.token, data.usuario);
            window.location.href = '/';
        } else {
            SIGMA.mostrarError(data && data.error ? data.error : 'Error al iniciar sesión.');
        }
    });
</script>
{% endblock %}
