{% extends 'base.html' %}
{% block title %}Registro - SIGMA-IOT{% endblock %}
{% block content %}
<div class="container">
    <div class="row justify-content-center">
        <div class="col-12 col-sm-10 col-md-8 col-lg-5">
            <div class="card auth-card shadow-sm mt-4">
                <div class="card-body p-4">
                    <div class="text-center mb-4">
                        <i class="bi bi-person-plus fs-1 text-primary"></i>
                        <h4 class="mt-2 mb-0">Crear cuenta</h4>
                        <small class="text-muted">Regístrate para acceder al panel</small>
                    </div>

                    <div id="alertMsg"></div>

                    <form id="registerForm" autocomplete="off">
                        <div class="row">
                            <div class="col-md-6 mb-3">
                                <label class="form-label" for="nombre">Nombre</label>
                                <input type="text" class="form-control" id="nombre" required>
                            </div>
                            <div class="col-md-6 mb-3">
                                <label class="form-label" for="apellido">Apellido</label>
                                <input type="text" class="form-control" id="apellido" required>
                            </div>
                        </div>
                        <div class="mb-3">
                            <label class="form-label" for="email">Correo electrónico</label>
                            <input type="email" class="form-control" id="email" required placeholder="usuario@correo.com">
                        </div>
                        <div class="mb-3">
                            <label class="form-label" for="username">Nombre de usuario</label>
                            <input type="text" class="form-control" id="username" required minlength="3">
                        </div>
                        <div class="row">
                            <div class="col-md-6 mb-3">
                                <label class="form-label" for="password">Contraseña</label>
                                <input type="password" class="form-control" id="password" required placeholder="Mín. 8 caracteres, letra y número">
                            </div>
                            <div class="col-md-6 mb-3">
                                <label class="form-label" for="confirmacion">Confirmar contraseña</label>
                                <input type="password" class="form-control" id="confirmacion" required>
                            </div>
                        </div>
                        <button type="submit" class="btn btn-primary w-100" id="btnRegister">
                            <i class="bi bi-check-circle me-1"></i>Registrarse
                        </button>
                    </form>

                    <hr>
                    <div class="text-center">
                        <span class="small text-muted">¿Ya tienes cuenta?</span>
                        <a href="{{ url_for('auth_login_page') }}" class="small"> Inicia sesión</a>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}

{% block scripts %}
<script>
    document.getElementById('registerForm').addEventListener('submit', async function (e) {
        e.preventDefault();
        const btn = document.getElementById('btnRegister');
        btn.disabled = true;
        const password = document.getElementById('password').value;
        const confirmacion = document.getElementById('confirmacion').value;

        if (password !== confirmacion) {
            SIGMA.mostrarError('La confirmación de contraseña no coincide.');
            btn.disabled = false;
            return;
        }

        const data = await SIGMA.api('/api/auth/registro', {
            method: 'POST',
            body: JSON.stringify({
                nombre: document.getElementById('nombre').value.trim(),
                apellido: document.getElementById('apellido').value.trim(),
                email: document.getElementById('email').value.trim(),
                username: document.getElementById('username').value.trim(),
                password: password,
                confirmacion: confirmacion
            })
        });
        btn.disabled = false;
        if (data && data.success) {
            SIGMA.mostrarExito(data.message + ' Serás redirigido al inicio de sesión.');
            setTimeout(() => window.location.href = '/login', 1800);
        } else if (data && data.errors) {
            SIGMA.mostrarError(data.errors.join('<br>'));
        } else {
            SIGMA.mostrarError('No fue posible crear la cuenta.');
        }
    });
</script>
{% endblock %}
